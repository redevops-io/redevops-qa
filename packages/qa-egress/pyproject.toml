[project]
name = "redevops-qa-egress"
version = "0.1.0.dev0"
description = "Egress gateway for ReDevOps QA: the enforcement point for the harness egress policy, and the browser launch settings that route every request through it"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-AGPL-3.0-or-later-with-Commons-Clause"
license-files = ["LICENSE*"]      # the family licence texts; tools/build_bundle.py copies them next to this file before it builds the wheel
# Standard library only. The harness neutral module (the pure egress policy) is the repository's pinned tree (pins.toml).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
redevops-qa-egress = "qa_egress.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
