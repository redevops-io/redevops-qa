[project]
name = "redevops-qa-robot"
version = "0.1.0.dev0"
description = "Robot Framework suite adapter for ReDevOps QA: strict output.xml import, an allowlist of libraries and no library installation"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-AGPL-3.0-or-later-with-Commons-Clause"
license-files = ["LICENSE*"]      # the family licence texts; tools/build_bundle.py copies them next to this file before it builds the wheel
# The shared adapter kit (packages/qa-adapter-kit) is imported from the repository. Robot Framework is an optional, pinned extra that only
# the suite process imports (the adapter itself never does); it is listed in third_party/adapter-license-matrix.yaml.
dependencies = []

[project.optional-dependencies]
robot = ["robotframework==7.5.1"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
