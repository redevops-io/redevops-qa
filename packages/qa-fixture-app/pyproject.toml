[project]
name = "redevops-qa-fixture-app"
version = "0.1.0.dev0"
description = "Deterministic local web app with seeded data and one switchable, documented defect, used as the target of ReDevOps QA end-to-end tests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-AGPL-3.0-or-later-with-Commons-Clause" }
# Standard library only: no framework, no pinned harness tree and no contracts package is imported by this package.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
redevops-qa-fixture-app = "qa_fixture_app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
