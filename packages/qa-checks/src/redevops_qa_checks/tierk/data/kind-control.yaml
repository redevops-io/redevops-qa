# kind cluster configuration for the control lane (older node minor). Identical to the primary lane except for the name,
# the API server port and the node image.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: qa-tier-k-control
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 46444
  disableDefaultCNI: true
  kubeProxyMode: "none"
  serviceSubnet: "10.43.0.0/16"
  podSubnet: "10.244.0.0/16"
nodes:
  - role: control-plane
    image: "kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0"
  - role: worker
    image: "kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0"
  - role: worker
    image: "kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0"
