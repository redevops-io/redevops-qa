[project]
name = "redevops-qa-selenium"
version = "0.1.0.dev0"
description = "Selenium (Python) adapters for ReDevOps QA: an interactive adapter over a driver protocol and a suite adapter that imports JUnit XML"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-AGPL-3.0-or-later-with-Commons-Clause" }
# The shared adapter kit (packages/qa-adapter-kit) is imported from the repository; Selenium is an optional, pinned extra that only the
# real driver imports. Both are listed in third_party/adapter-license-matrix.yaml.
dependencies = []

[project.optional-dependencies]
browser = ["selenium==4.52.0"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
