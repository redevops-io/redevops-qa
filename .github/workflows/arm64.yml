name: arm64

# The lanes on Linux arm64, natively (GitHub's ubuntu-24.04-arm runners; no emulation anywhere). Read-only and secret-free like `tests`: no tag trigger, no release or publish
# step, no secret. What it shows is what the platform claim for linux-arm64 rests on:
#   * the runner's browser lane and Robot egress lane tests against the real Chromium and the real kernel layers of an arm64 host;
#   * the linux-arm64 bundle, built twice and compared, checked, installed with the README's commands, its Chromium checked against bundle/browser.lock.linux-arm64.json,
#     `doctor`, and the demo for the clean target and for each seeded defect (the defect must be caught by the lane it belongs to);
#   * the image built for linux/arm64 from this commit and driven through the documented Compose files.
# A missing dependency, a skipped test or a lane that does not start fails the job: nothing here counts as passed by not running.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-lanes:
    name: arm64 lanes from source (real Chromium, Robot Framework 7.5, the kernel layers of the Robot lane; a missing dependency fails, nothing is skipped)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: This is an arm64 host
        run: |
          uname -srm
          [ "$(uname -m)" = aarch64 ]
          cat /sys/kernel/security/lsm; echo
      - name: Install the pinned test tools, Playwright and Robot Framework
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7" "jsonschema==4.26.0" "playwright==1.64.1" "robotframework==7.5"
      - name: Fetch and verify the pinned upstreams (HEAD at the pinned commit, clean tree, digests)
        run: python tools/fetch_pins.py
      - name: Browser install (prefetch; no credentials; the tests never download anything)
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers" python -m playwright install --with-deps chromium
      - name: Fail unless the pinned engines are importable
        run: python -c "import importlib.metadata as m, playwright.sync_api, robot; assert m.version('playwright') == '1.64.1' and m.version('robotframework') == '7.5'"
      - name: What this host offers the layers (the experiments decide)
        run: PYTHONPATH=packages/qa-runner/src python -s -m qa_runner.netfence --probe
      - name: The runner's browser lane (scrubbed environment; only tests marked browser)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            python -m pytest -q -m browser packages/qa-runner/tests/browser --junitxml="$RUNNER_TEMP/junit-arm64-browser.xml"
      - name: Fail on zero collected tests or any skip (browser lane)
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-arm64-browser.xml"
      - name: The Robot egress experiments and their mutations (scrubbed environment; only tests marked robot_egress)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q -m robot_egress packages/qa-runner/tests/robot_egress --junitxml="$RUNNER_TEMP/junit-arm64-robot-egress.xml"
      - name: Fail on zero collected tests or any skip (Robot egress lane)
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-arm64-robot-egress.xml"
      - name: Fail if the tests left anything in the working tree
        run: test -z "$(git status --porcelain --untracked-files=no)"

  arm64-bundle:
    name: arm64 bundle (CPython 3.12, linux arm64; built twice and compared; checked; installed with the README commands; the pinned Chromium; doctor; the demo for each seeded defect)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: This is an arm64 host
        run: '[ "$(uname -m)" = aarch64 ]'
      - name: Fetch and verify the pinned upstreams
        run: python tools/fetch_pins.py
      - name: Build the linux-arm64 bundle
        run: python tools/build_bundle.py build --platform linux-arm64 --out "$RUNNER_TEMP/build-1" --download-cache "$RUNNER_TEMP/cache-1"
      - name: Build it again with an empty download cache and compare
        run: |
          python tools/build_bundle.py build --platform linux-arm64 --out "$RUNNER_TEMP/build-2" --download-cache "$RUNNER_TEMP/cache-2"
          a="$(ls -d "$RUNNER_TEMP"/build-1/redevops-qa-bundle-*-cp312-linux-arm64)"; b="$(ls -d "$RUNNER_TEMP"/build-2/redevops-qa-bundle-*-cp312-linux-arm64)"
          diff "$a/SHA256SUMS" "$b/SHA256SUMS"
          [ "$(sha256sum < "$a.tar")" = "$(sha256sum < "$b.tar")" ]
          echo "REPRODUCIBILITY: two builds of this commit on this runner are byte for byte identical (SHA256SUMS and the archive)"
      - name: Build the bundle that stands in for the previous one (another label, so another digest)
        run: python tools/build_bundle.py build --platform linux-arm64 --out "$RUNNER_TEMP/build-previous" --label rollback-previous --download-cache "$RUNNER_TEMP/cache-1"
      - name: Check both bundles with the standalone checker (a clean interpreter, away from the checkout)
        run: |
          cd "$RUNNER_TEMP"
          for d in build-1 build-previous; do python -I "$GITHUB_WORKSPACE/tools/check_bundle.py" "$RUNNER_TEMP/$d"/redevops-qa-bundle-*-cp312-linux-arm64; done
      - name: The bundle's own acceptance run (README commands unchanged, the real Chromium checked against its pin, doctor, demo, a tampered browser refused, rollback, uninstall)
        run: |
          mkdir "$RUNNER_TEMP/current" "$RUNNER_TEMP/previous"
          cp "$RUNNER_TEMP"/build-1/*.tar "$RUNNER_TEMP"/build-1/*.tar.sha256 "$RUNNER_TEMP/current/"
          cp "$RUNNER_TEMP"/build-previous/*.tar "$RUNNER_TEMP"/build-previous/*.tar.sha256 "$RUNNER_TEMP/previous/"
          bash tools/bundle_acceptance.sh --current "$RUNNER_TEMP/current" --previous "$RUNNER_TEMP/previous"
      - name: Install once more and run the demo for the clean target and each seeded defect (the defect is caught by the lane it belongs to)
        run: |
          cd "$RUNNER_TEMP" && tar xf current/*.tar && cd redevops-qa-bundle-*-cp312-linux-arm64
          ./install.sh --prefix "$RUNNER_TEMP/rq"
          ./install-browser.sh --prefix "$RUNNER_TEMP/rq"
          rq="$RUNNER_TEMP/rq/bin/redevops-qa"
          "$rq" doctor | tee "$RUNNER_TEMP/doctor.txt"
          grep -q "^\[ OK \] platform: linux arm64" "$RUNNER_TEMP/doctor.txt"
          grep -q "^\[ OK \] browser build" "$RUNNER_TEMP/doctor.txt"
          grep -q "^\[ OK \] robot egress layers" "$RUNNER_TEMP/doctor.txt"
          ! grep -q "^\[\(WARN\|FAIL\)\]" "$RUNNER_TEMP/doctor.txt"
          run() { st=0; "$rq" demo --defect "$1" --out "$RUNNER_TEMP/ev-$1" > "$RUNNER_TEMP/demo-$1.txt" 2>&1 || st=$?; cat "$RUNNER_TEMP/demo-$1.txt"; echo "exit status $st"; [ "$st" = "$2" ]; }
          run none 0
          grep -q "VERIFIED (ALL_ASSERTIONS_VERIFIED)" "$RUNNER_TEMP/demo-none.txt"
          run settings 1
          grep -q "lane browser: engine reported NATIVE_FAIL" "$RUNNER_TEMP/demo-settings.txt" && grep -q "lane robot: engine reported NATIVE_PASS" "$RUNNER_TEMP/demo-settings.txt"
          run discount 1
          grep -q "lane robot: engine reported NATIVE_FAIL" "$RUNNER_TEMP/demo-discount.txt" && grep -q "lane browser: engine reported NATIVE_PASS" "$RUNNER_TEMP/demo-discount.txt"
      - name: Every URL of the arm64 browser pin serves the pinned bytes
        run: python -I packages/qa-runner/src/qa_runner/browser_pin.py urls --lock bundle/browser.lock.linux-arm64.json --fallbacks-only
      - name: Keep the bundle (a workflow artifact only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: qa-bundle-linux-arm64
          path: |
            ${{ runner.temp }}/build-1/*.tar
            ${{ runner.temp }}/build-1/*.tar.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Fail if the run left anything in the working tree
        run: test -z "$(git status --porcelain --untracked-files=no)"

  arm64-image:
    name: arm64 image (built natively from this commit; Compose from an empty directory; probes, 401, real runs through the API including the demo with the Robot lane's kernel layers, verification, persistence)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Build the image from this commit (linux/arm64, natively)
        run: |
          [ "$(uname -m)" = aarch64 ]
          docker build -f deploy/standalone/Dockerfile --build-arg VERSION=ci --build-arg VCS_REF="$GITHUB_SHA" -t redevops-qa:ci .
          [ "$(docker image inspect redevops-qa:ci --format '{{.Architecture}}')" = arm64 ]
          [ "$(docker image inspect redevops-qa:ci --format '{{.Config.User}}')" = "10001:10001" ]
      - name: Compose from an empty directory, the three demo runs through the API, verification, persistence
        run: QA_SMOKE_IMAGE=redevops-qa QA_SMOKE_TAG=ci bash deploy/standalone/smoke.sh
      - name: Fail if the run left anything in the working tree
        run: test -z "$(git status --porcelain --untracked-files=no)"
