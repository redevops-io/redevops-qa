name: diag
on:
  push:
    branches: ["qa-r0-robot-egress-diag"]
permissions:
  contents: read
jobs:
  regen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7" "playwright==1.64.1" "robotframework==7.5"
      - run: PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers" python -m playwright install --with-deps chromium
      - name: Regenerate the golden bundles from real runs
        run: |
          mkdir -p /tmp/qa-golden
          export PYTHONPATH="$(ls -d $PWD/packages/*/src | tr '\n' ':')"
          TMPDIR=/tmp/qa-golden PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers" python packages/qa-runner/tests/golden/regen_bundles.py
          TMPDIR=/tmp/qa-golden python packages/qa-runner/tests/golden/regen_robot.py
          ls -la packages/qa-runner/tests/golden
      - uses: actions/upload-artifact@v4
        with:
          name: golden
          path: packages/qa-runner/tests/golden/*.tar
