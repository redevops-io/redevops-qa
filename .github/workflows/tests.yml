name: tests

# Read-only and secret-free: no tag trigger, no release or publish step, no secret and no token input. The two pinned upstreams
# (public repositories) are fetched by exact commit SHA with the workflow's own read-only permissions, then verified against
# pins.toml (HEAD, clean tree, tree digest, vector-file digests) before anything runs. A pin that cannot be fetched or does not
# verify fails the job; nothing is skipped. Both jobs run for every pin set in pins.toml.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: pins.toml is well formed (a TEMP-PIN is allowed only on a feature branch)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every pin set
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          branch="${HEAD_REF:-$REF_NAME}"
          case "$branch" in
            qa-p1/*|qa-ea/*|feature/*) flag="" ;;
            *) flag="--forbid-temp-pin" ;;
          esac
          for set in c3 c4; do
            PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --pin-set "$set" $flag
          done

  adapter-licences:
    name: adapter licence matrix (unknown or incompatible redistributables fail; technical triage, not legal advice)
    # Offline and independent of the pinned upstreams: reads third_party/adapter-license-matrix.yaml and the install lists of the
    # packages and workflows. No download, no secret.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Check the matrix against the policy and against what the repository installs
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 python tools/check_adapter_licenses.py
      - name: Run the matrix tests (scrubbed environment)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q tests/test_adapter_license_matrix.py --junitxml="$RUNNER_TEMP/junit-adapter-licences.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-adapter-licences.xml"

  neutral-wording:
    name: neutral wording (no tracked file carries a deny-listed term; offline, no pins; no skips, at least one test)
    # Independent of the pinned upstreams: reads the tracked files only. The deny-list is held as digests in
    # tools/check_neutral_wording.py; a hit is reported as file:line. Offline, read-only, no secret.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Scan the tracked files
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 python tools/check_neutral_wording.py
      - name: Run the guard tests in a scrubbed environment
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q tests/test_neutral_wording.py --junitxml="$RUNNER_TEMP/junit-neutral-wording.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-neutral-wording.xml"

  adapter-kit:
    name: adapter kit (standard library only; fake adapters; supervisor, models, mapping; no skips, at least one test)
    # Independent of the pinned upstreams and of every framework: the kit imports none. Offline, read-only, no secret. Secret-looking
    # values in the tests are generated at run time.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the kit tests in a scrubbed environment
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q packages/qa-adapter-kit/tests --junitxml="$RUNNER_TEMP/junit-adapter-kit.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-adapter-kit.xml"

  fixture-app:
    name: fixture app (Python ${{ matrix.python }}; standard library only; loopback only; golden responses, defect isolation, determinism, shutdown; no skips, at least one test)
    # Independent of the pinned upstreams and of every framework: the app and its tests import none. Offline (the tests connect to
    # loopback only and a test fails on any other address), read-only, no secret, no browser. The tests start the app as a subprocess
    # and require it to exit on a signal and on a closed standard input; nothing is written outside the temporary directories.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the fixture app tests in a scrubbed environment
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q packages/qa-fixture-app/tests --junitxml="$RUNNER_TEMP/junit-fixture-app.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-fixture-app.xml"
      - name: Fail if the tests left anything in the working tree
        run: test -z "$(git status --porcelain)"

  evidence:
    name: evidence bundle (standard library only; layout, report schema, reader, offline verifier, tamper matrix, determinism, mutation suite; no skips, at least one test)
    # Independent of the pinned upstreams and of every engine: the package imports none. Offline, read-only, no secret. The golden digests in the
    # tests are the same constants on every host; this job is their Linux evidence, and it prints the digests it rebuilt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install "pytest>=8,<10"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the evidence tests in a scrubbed environment
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q packages/qa-evidence/tests --junitxml="$RUNNER_TEMP/junit-evidence.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-evidence.xml"
      - name: Rebuild the golden bundle and print its digests (compare with the golden vectors in the tests and with the macOS run)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/qa-evidence/src:packages/qa-evidence/tests \
            python -c "import hashlib; from qe_helpers import build_base; b = build_base(); print('manifest', b.manifest_digest); print('archive sha256:' + hashlib.sha256(b.archive_bytes()).hexdigest())"

  runner:
    name: runner (Python ${{ matrix.python }}; offline; exact pins; plan freezing, verdicts, bundle, supervision with a test-double lane, doctor, mutation suite; no skips, at least one test)
    # The runner without a browser: the lane child process is a test double that lives in the tests (the product has no such mode), the target (the fixture app) is real.
    # Offline, read-only, no secret. The pinned upstreams are fetched by exact commit and verified before anything runs.
    runs-on: ubuntu-24.04
    needs: pins
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - name: Verify the fetched trees are exactly the pins (HEAD, clean, tree digest, vector digests)
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --verify-trees --require-git
      - name: Install test tools (the pinned trees are imported from their paths, not installed)
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the runner tests in a scrubbed environment (no browser is installed)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q packages/qa-runner/tests --junitxml="$RUNNER_TEMP/junit-runner.xml"
      - name: Fail if the suite left a reading child behind (the mutation suite blocks workers on purpose)
        run: |
          sleep 3
          if pgrep -fa 'qa_runner[.]read_worker'; then echo "a read worker outlived the suite"; exit 1; fi
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-runner.xml"

  runner-browser:
    name: runner browser lane (real Chromium; Playwright pinned; the harness executor, the real adapter and the egress gateway against the fixture app; a missing Playwright or browser fails, never skips)
    # Runs the command line and the orchestrated browser lane end to end for the clean target and the seeded settings defect, a forbidden navigation, a page that tries
    # to reach another origin, a lane deadline and the doctor. Read-only, no secret; the browser is installed in its own prefetch step and nothing downloads at test time.
    runs-on: ubuntu-24.04
    needs: pins
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - name: Verify the fetched trees are exactly the pins (HEAD, clean, tree digest, vector digests)
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --verify-trees --require-git
      - name: Install the pinned test tools and Playwright
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7" "playwright==1.64.1"
      - name: Browser install (prefetch; no credentials; the tests never download anything)
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers" python -m playwright install --with-deps chromium
      - name: Fail unless the pinned Playwright is importable
        run: python -c "import importlib.metadata as m, playwright.sync_api; assert m.version('playwright') == '1.64.1', m.version('playwright')"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the runner browser lane (scrubbed environment; only tests marked browser)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            python -m pytest -q -m browser packages/qa-runner/tests/browser --junitxml="$RUNNER_TEMP/junit-runner-browser.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-runner-browser.xml"
      - name: Fail if the tests left anything in the working tree
        run: test -z "$(git status --porcelain)"

  runner-robot:
    name: runner Robot lane (Robot Framework 7.5 pinned; the reviewed suite, the Robot adapter and the SCRIPT executor over the hash-pinned check program against the fixture app; a missing Robot Framework fails, never skips)
    # Runs the command line and the orchestrated Robot lane end to end for the clean target and the seeded discount defect, a library changed after freezing, a library nobody
    # reviewed and a lane deadline. No browser is installed. Read-only, no secret.
    runs-on: ubuntu-24.04
    needs: pins
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - name: Verify the fetched trees are exactly the pins (HEAD, clean, tree digest, vector digests)
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --verify-trees --require-git
      - name: Install the pinned test tools and Robot Framework
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7" "robotframework==7.5"
      - name: Fail unless the pinned Robot Framework is importable
        run: python -c "import importlib.metadata as m, robot; assert m.version('robotframework') == '7.5', m.version('robotframework')"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the runner Robot lane (scrubbed environment; only tests marked robot_real)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q -m robot_real packages/qa-runner/tests/real --junitxml="$RUNNER_TEMP/junit-runner-robot.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-runner-robot.xml"
      - name: Fail if the tests left anything in the working tree
        run: test -z "$(git status --porcelain)"

  bridge:
    name: bridge tests (${{ matrix.pin_set }}; exact pins, no skips, at least one test)
    runs-on: ubuntu-24.04
    needs: pins
    strategy:
      fail-fast: false
      matrix:
        pin_set: [c3, c4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --pin-set "${{ matrix.pin_set }}" --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - name: Verify the fetched trees are exactly the pins (HEAD, clean, tree digest, vector digests)
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --pin-set "${{ matrix.pin_set }}" --verify-trees --require-git
      - name: Install test tools (the pinned trees are imported from their paths, not installed)
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the bridge and repository tests in a scrubbed environment (the conformance suite has its own job)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            REDEVOPS_QA_PIN_SET="${{ matrix.pin_set }}" \
            python -m pytest -q --ignore=packages/qa-bridge/tests/conformance --junitxml=junit-bridge.xml
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py junit-bridge.xml

  conformance:
    name: conformance (${{ matrix.pin_set }}; release-critical, never skipped)
    runs-on: ubuntu-24.04
    needs: pins
    strategy:
      fail-fast: false
      matrix:
        pin_set: [c3, c4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --pin-set "${{ matrix.pin_set }}" --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - name: Verify the fetched trees are exactly the pins (HEAD, clean, tree digest, vector digests)
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --pin-set "${{ matrix.pin_set }}" --verify-trees --require-git
      - name: Install test tools
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Output directory outside the checkout (the receipt requires a clean working tree)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
      - name: Run the conformance suite and write the compat-receipt/1
        # A missing or inexact dependency, zero collected tests, any skip, a dirty tree and any failed check all give a non-zero exit.
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/qa-bridge/src \
            REDEVOPS_QA_PIN_SET="${{ matrix.pin_set }}" QA_CI_WORKFLOW="${{ github.workflow }}" QA_CI_RUN_ID="${{ github.run_id }}" \
            python -m redevops_qa_bridge.conformance.cli run --receipt "$OUT/compat-receipt-${{ matrix.pin_set }}.json" \
              --report "$OUT/divergence-report-${{ matrix.pin_set }}.json" --report-md "$OUT/divergence-report-${{ matrix.pin_set }}.md" \
              --junit "$OUT/junit-conformance-${{ matrix.pin_set }}.xml"
      - name: Fail on zero collected tests or any skip (second, independent check of the JUnit report)
        run: python tools/check_junit.py "$OUT/junit-conformance-${{ matrix.pin_set }}.xml"
      - name: Verify the receipt (hash, consistency, not stale; c4 must list no not-applicable item)
        run: |
          flag=""
          if [ "${{ matrix.pin_set }}" = "c4" ]; then flag="--forbid-not-applicable"; fi
          env -i HOME="$(mktemp -d)" PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/qa-bridge/src \
            REDEVOPS_QA_PIN_SET="${{ matrix.pin_set }}" \
            python -m redevops_qa_bridge.conformance.cli verify "$OUT/compat-receipt-${{ matrix.pin_set }}.json" $flag
      - name: Upload the receipt and the divergence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-receipt-${{ matrix.pin_set }}
          path: |
            ${{ runner.temp }}/out/compat-receipt-${{ matrix.pin_set }}.json
            ${{ runner.temp }}/out/divergence-report-${{ matrix.pin_set }}.json
            ${{ runner.temp }}/out/divergence-report-${{ matrix.pin_set }}.md
          if-no-files-found: error

  browser:
    name: browser lane (real Chromium; Playwright pinned; a missing Playwright or browser fails, never skips)
    # The only job that installs Playwright and a browser. The offline jobs above never collect tests/browser (pytest's
    # norecursedirs and the explicit paths below). Read-only, no secret, no token input; the browser is installed in its own
    # prefetch step with no credentials and the tests then run against a fixture served from loopback by the test itself.
    runs-on: ubuntu-24.04
    needs: pins
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - name: Verify the fetched trees are exactly the pins (HEAD, clean, tree digest, vector digests)
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --verify-trees --require-git
      - name: Install the pinned test tools and Playwright
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7" "playwright==1.64.1"
      - name: Browser install (prefetch; no credentials; the tests never download anything)
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers" python -m playwright install --with-deps chromium
      - name: Fail unless the pinned Playwright is importable
        run: python -c "import importlib.metadata as m, playwright.sync_api; assert m.version('playwright') == '1.64.1', m.version('playwright')"
