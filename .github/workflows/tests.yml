name: tests

# Read-only. No tag trigger, no release or publish step, no credentials beyond the read token that fetches the pinned
# upstream commits (see pins.toml); fork pull requests do not receive that secret, so the pinned jobs cannot run for
# them and the run is red rather than skipped.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: pins.toml is well formed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check pins.toml (a TEMP-PIN is refused on main)
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then flag="--forbid-temp-pin"; else flag=""; fi
          PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins $flag

  bridge:
    name: bridge tests (exact pins, no skips, at least one test)
    runs-on: ubuntu-24.04
    needs: pins
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned commits
        id: pins
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pins.toml", "rb") as handle:
              pins = tomllib.load(handle)
          print("contracts_repo=" + pins["contracts"]["repo"])
          print("contracts_commit=" + pins["contracts"]["commit"])
          print("harness_repo=" + pins["harness_qa"]["repo"])
          print("harness_commit=" + pins["harness_qa"]["commit"])
          PY
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: .pinned/runtime-contracts
          token: ${{ secrets.QA_PINS_READ_TOKEN }}
          persist-credentials: false
      - name: Fetch agent-harness (QA module) at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_repo }}
          ref: ${{ steps.pins.outputs.harness_commit }}
          path: .pinned/agent-harness
          token: ${{ secrets.QA_PINS_READ_TOKEN }}
          persist-credentials: false
      - name: Install test tools (the pinned trees are imported from .pinned, not installed)
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Run the tests in a scrubbed environment
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q --junitxml=junit-bridge.xml
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py junit-bridge.xml
