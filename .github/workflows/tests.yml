  appium-server:
    name: "appium server lane (real Appium 3.9.0 server and client 6.1.1, no device; NOT a required check until proven; a missing dependency fails, never skips)"
    # Real server and client, no Android SDK and no device: shows the client talks to the server, the UiAutomator2 driver accepts the
    # adapter's capabilities and a worker without a device is reported as unavailable. Read-only, no secret. The server listens on loopback only.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned test tools and Appium Python client
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7" "Appium-Python-Client==6.1.1"
      - name: Install the pinned Appium server and the UiAutomator2 driver (no script runs; nothing else is downloaded)
        run: |
          npm install --prefix "$RUNNER_TEMP/appium" --ignore-scripts --no-audit --no-fund appium@3.9.0
          mkdir -p "$RUNNER_TEMP/appium-home"
          env -i HOME="$RUNNER_TEMP" PATH="$PATH" APPIUM_HOME="$RUNNER_TEMP/appium-home" "$RUNNER_TEMP/appium/node_modules/.bin/appium" driver install uiautomator2@8.7.3
      - name: Start the Appium server on loopback without any Android SDK variable
        run: |
          nohup env -i HOME="$RUNNER_TEMP" PATH="$PATH" APPIUM_HOME="$RUNNER_TEMP/appium-home" "$RUNNER_TEMP/appium/node_modules/.bin/appium" --address 127.0.0.1 --port 4723 --log-level warn > "$RUNNER_TEMP/appium-server.log" 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:4723/status", timeout=2).read()
                  raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception:
                  time.sleep(1)
          raise SystemExit("FAIL: the Appium server did not answer within 60 seconds")
          PY
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the server lane (scrubbed environment; only tests marked appium_server)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 QA_APPIUM_URL=http://127.0.0.1:4723 \
            python -m pytest -q -m appium_server packages/qa-appium/tests/real --junitxml="$RUNNER_TEMP/junit-appium-server.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-appium-server.xml"
      - name: Server log (diagnostics)
        if: always()
        run: tail -n 50 "$RUNNER_TEMP/appium-server.log" || true

  profile-local-python-robot:
    name: "install profile local-python-robot (clean venv from the pinned commit; linux-x86_64; NOT a required check until proven; a failed step fails, nothing is skipped)"
    # Runs the profile's own documented steps (tools/run_install_profile.py reads qa-install-profiles.json and runs what the configurator would print) in a
    # clean virtual environment, from the repository checked out at the pinned commit named in the profile. Read-only, no secret. Never a dependency of
    # another job and never conditional; a failed step fails the job, nothing is skipped.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the pinned commit
        id: profile
        run: python3 -c "import json; print('commit=' + json.load(open('qa-install-profiles.json'))['source']['pinned_commit'])" >> "$GITHUB_OUTPUT"
      - name: Fetch the repository at the pinned commit (the source phase of the profile)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.profile.outputs.commit }}
          path: .profile-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the profile - install, smoke, check
        run: |
          python tools/run_install_profile.py --profile local-python-robot --host linux-x86_64 --channel stable --work "$RUNNER_TEMP/profile-work" \
            --checkout "$GITHUB_WORKSPACE/.profile-src" --phases install,smoke,check
      - name: Keep the evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-local-python-robot
          path: ${{ runner.temp }}/profile-work/evidence
          if-no-files-found: error
      - name: Uninstall (the profile's uninstall phase; the virtual environment must be gone)
        run: |
          python tools/run_install_profile.py --profile local-python-robot --host linux-x86_64 --channel stable --work "$RUNNER_TEMP/profile-work" \
            --checkout "$GITHUB_WORKSPACE/.profile-src" --phases uninstall

  profile-local-python-selenium:
    name: "install profile local-python-selenium (clean venv from the pinned commit; real Chrome; linux-x86_64; NOT a required check until proven; a failed step fails, nothing is skipped)"
    # Runs the profile's own documented steps (tools/run_install_profile.py reads qa-install-profiles.json and runs what the configurator would print) in a
    # clean virtual environment, from the repository checked out at the pinned commit named in the profile. Read-only, no secret. Never a dependency of
    # another job and never conditional; a failed step fails the job, nothing is skipped.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the pinned commit
        id: profile
        run: python3 -c "import json; print('commit=' + json.load(open('qa-install-profiles.json'))['source']['pinned_commit'])" >> "$GITHUB_OUTPUT"
      - name: Fetch the repository at the pinned commit (the source phase of the profile)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.profile.outputs.commit }}
          path: .profile-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate the runner's Chrome and ChromeDriver (fail when either is missing)
        run: |
          chrome="$(command -v google-chrome || true)"
          driver=""
          if [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then driver="$CHROMEWEBDRIVER/chromedriver"; fi
          if [ -z "$driver" ]; then driver="$(command -v chromedriver || true)"; fi
          if [ ! -x "$chrome" ] || [ ! -x "$driver" ]; then echo "FAIL: Chrome ($chrome) or ChromeDriver ($driver) is missing on this runner"; exit 1; fi
          "$chrome" --version
          "$driver" --version
          echo "QA_CHROME_BINARY=$chrome" >> "$GITHUB_ENV"
          echo "QA_CHROMEDRIVER_PATH=$driver" >> "$GITHUB_ENV"
      - name: Run the profile - install, smoke, check
        run: |
          python tools/run_install_profile.py --profile local-python-selenium --host linux-x86_64 --channel stable --work "$RUNNER_TEMP/profile-work" \
            --checkout "$GITHUB_WORKSPACE/.profile-src" --phases install,smoke,check \
            --param chrome_binary="$QA_CHROME_BINARY" --param chromedriver_path="$QA_CHROMEDRIVER_PATH"
      - name: Keep the evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-local-python-selenium
          path: ${{ runner.temp }}/profile-work/evidence
          if-no-files-found: error
      - name: Uninstall (the profile's uninstall phase; the virtual environment must be gone)
        run: |
          python tools/run_install_profile.py --profile local-python-selenium --host linux-x86_64 --channel stable --work "$RUNNER_TEMP/profile-work" \
            --checkout "$GITHUB_WORKSPACE/.profile-src" --phases uninstall \
            --param chrome_binary="$QA_CHROME_BINARY" --param chromedriver_path="$QA_CHROMEDRIVER_PATH"

