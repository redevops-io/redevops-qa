  robot-real:
    name: "robot real lane (Robot Framework 7.5 pinned; NOT a required check until proven; a missing Robot Framework fails, never skips)"
    # The only job that installs Robot Framework. No browser, no emulator, no secret; read-only. The suites are written by the tests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
