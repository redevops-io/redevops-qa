  install-profiles:
    name: "install profiles (data, steps, pins, status, generator vectors, generated document; offline; never skipped)"
    # Runs on every push and pull request, with no path filter, no condition and no dependency on another job. Offline, read-only, no secret. It needs the
    # full history (every pinned or recorded commit must be an ancestor of main). The full jsonschema package only cross-checks the strict validator.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools and the cross-check validator
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7" "jsonschema==4.26.0"
      - name: Check the profiles (schema, steps, pins, status, document, freshness against main) and cross-check the validator
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 python tools/check_install_profiles.py --cross-check
      - name: Run the profile, generator and vector tests in a scrubbed environment
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q tests/test_install_profiles.py tests/test_install_config.py --junitxml="$RUNNER_TEMP/junit-install-profiles.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-install-profiles.xml"
