name: tests

# Read-only and secret-free: no tag trigger, no release or publish step, no secret and no token input. The two pinned upstreams
# (public repositories) are fetched by exact commit SHA with the workflow's own read-only permissions, then verified against
# pins.toml (HEAD, clean tree, tree digest, vector-file digests) before anything runs. A pin that cannot be fetched or does not
# verify fails the job; nothing is skipped. Both jobs run for every pin set in pins.toml.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: pins.toml is well formed (a TEMP-PIN is allowed only on a feature branch)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every pin set
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          branch="${HEAD_REF:-$REF_NAME}"
          case "$branch" in
            qa-p1/*|qa-ea/*|feature/*) flag="" ;;
            *) flag="--forbid-temp-pin" ;;
          esac
          for set in c3 c4; do
            PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --pin-set "$set" $flag
          done

  adapter-licences:
    name: adapter licence matrix (unknown or incompatible redistributables fail; technical triage, not legal advice)
    # Offline and independent of the pinned upstreams: reads third_party/adapter-license-matrix.yaml and the install lists of the
    # packages and workflows. No download, no secret.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Check the matrix against the policy and against what the repository installs
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 python tools/check_adapter_licenses.py
      - name: Run the matrix tests (scrubbed environment)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q tests/test_adapter_license_matrix.py --junitxml="$RUNNER_TEMP/junit-adapter-licences.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-adapter-licences.xml"

  neutral-wording:
    name: neutral wording (no tracked file carries a deny-listed term; offline, no pins; no skips, at least one test)
    # Independent of the pinned upstreams: reads the tracked files only. The deny-list is held as digests in
    # tools/check_neutral_wording.py; a hit is reported as file:line. Offline, read-only, no secret.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Scan the tracked files
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 python tools/check_neutral_wording.py
      - name: Run the guard tests in a scrubbed environment
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q tests/test_neutral_wording.py --junitxml="$RUNNER_TEMP/junit-neutral-wording.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-neutral-wording.xml"

  adapter-kit:
    name: adapter kit (standard library only; fake adapters; supervisor, models, mapping; no skips, at least one test)
    # Independent of the pinned upstreams and of every framework: the kit imports none. Offline, read-only, no secret. Secret-looking
    # values in the tests are generated at run time.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the kit tests in a scrubbed environment
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q packages/qa-adapter-kit/tests --junitxml="$RUNNER_TEMP/junit-adapter-kit.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-adapter-kit.xml"

  fixture-app:
    name: fixture app (Python ${{ matrix.python }}; standard library only; loopback only; golden responses, defect isolation, determinism, shutdown; no skips, at least one test)
    # Independent of the pinned upstreams and of every framework: the app and its tests import none. Offline (the tests connect to
    # loopback only and a test fails on any other address), read-only, no secret, no browser. The tests start the app as a subprocess
    # and require it to exit on a signal and on a closed standard input; nothing is written outside the temporary directories.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the fixture app tests in a scrubbed environment
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q packages/qa-fixture-app/tests --junitxml="$RUNNER_TEMP/junit-fixture-app.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-fixture-app.xml"
      - name: Fail if the tests left anything in the working tree
        run: test -z "$(git status --porcelain)"

  evidence:
    name: evidence bundle (standard library only; layout, report schema, reader, offline verifier, tamper matrix, determinism, mutation suite; no skips, at least one test)
    # Independent of the pinned upstreams and of every engine: the package imports none. Offline, read-only, no secret. The golden digests in the
    # tests are the same constants on every host; this job is their Linux evidence, and it prints the digests it rebuilt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install "pytest>=8,<10"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the evidence tests in a scrubbed environment
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q packages/qa-evidence/tests --junitxml="$RUNNER_TEMP/junit-evidence.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-evidence.xml"
      - name: Rebuild the golden bundle and print its digests (compare with the golden vectors in the tests and with the macOS run)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/qa-evidence/src:packages/qa-evidence/tests \
            python -c "import hashlib; from qe_helpers import build_base; b = build_base(); print('manifest', b.manifest_digest); print('archive sha256:' + hashlib.sha256(b.archive_bytes()).hexdigest())"

  runner:
    name: runner (Python ${{ matrix.python }}; offline; exact pins; plan freezing, verdicts, bundle, supervision with a test-double lane, doctor, mutation suite; no skips, at least one test)
    # The runner without a browser: the lane child process is a test double that lives in the tests (the product has no such mode), the target (the fixture app) is real.
    # Offline, read-only, no secret. The pinned upstreams are fetched by exact commit and verified before anything runs.
    runs-on: ubuntu-24.04
    needs: pins
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - name: Verify the fetched trees are exactly the pins (HEAD, clean, tree digest, vector digests)
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --verify-trees --require-git
      - name: Install test tools (the pinned trees are imported from their paths, not installed)
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the runner tests in a scrubbed environment (no browser is installed)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q packages/qa-runner/tests --junitxml="$RUNNER_TEMP/junit-runner.xml"
      - name: Fail if the suite left a reading child behind (the mutation suite blocks workers on purpose)
        run: |
          sleep 3
          if pgrep -fa 'qa_runner[.]read_worker'; then echo "a read worker outlived the suite"; exit 1; fi
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-runner.xml"

  runner-browser:
    name: runner browser lane (real Chromium; Playwright pinned; the harness executor, the real adapter and the egress gateway against the fixture app; a missing Playwright or browser fails, never skips)
    # Runs the command line and the orchestrated browser lane end to end for the clean target and the seeded settings defect, a forbidden navigation, a page that tries
    # to reach another origin, a lane deadline and the doctor. Read-only, no secret; the browser is installed in its own prefetch step and nothing downloads at test time.
    runs-on: ubuntu-24.04
    needs: pins
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - name: Verify the fetched trees are exactly the pins (HEAD, clean, tree digest, vector digests)
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --verify-trees --require-git
      - name: Install the pinned test tools and Playwright
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7" "playwright==1.64.1"
      - name: Browser install (prefetch; no credentials; the tests never download anything)
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers" python -m playwright install --with-deps chromium
      - name: Fail unless the pinned Playwright is importable
        run: python -c "import importlib.metadata as m, playwright.sync_api; assert m.version('playwright') == '1.64.1', m.version('playwright')"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the runner browser lane (scrubbed environment; only tests marked browser)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            python -m pytest -q -m browser packages/qa-runner/tests/browser --junitxml="$RUNNER_TEMP/junit-runner-browser.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-runner-browser.xml"
      - name: Fail if the tests left anything in the working tree
        run: test -z "$(git status --porcelain)"

  runner-robot:
    name: runner Robot lane (Robot Framework 7.5 pinned; the reviewed suite, the Robot adapter and the SCRIPT executor over the hash-pinned check program against the fixture app; a missing Robot Framework fails, never skips)
    # Runs the command line and the orchestrated Robot lane end to end for the clean target and the seeded discount defect, a library changed after freezing, a library nobody
    # reviewed and a lane deadline. No browser is installed. Read-only, no secret.
    runs-on: ubuntu-24.04
    needs: pins
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - name: Verify the fetched trees are exactly the pins (HEAD, clean, tree digest, vector digests)
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --verify-trees --require-git
      - name: Install the pinned test tools and Robot Framework
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7" "robotframework==7.5"
      - name: Fail unless the pinned Robot Framework is importable
        run: python -c "import importlib.metadata as m, robot; assert m.version('robotframework') == '7.5', m.version('robotframework')"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the runner Robot lane (scrubbed environment; only tests marked robot_real)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q -m robot_real packages/qa-runner/tests/real --junitxml="$RUNNER_TEMP/junit-runner-robot.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-runner-robot.xml"
      - name: Fail if the tests left anything in the working tree
        run: test -z "$(git status --porcelain)"

  runner-e2e:
    name: runner end to end (real Chromium and Robot Framework 7.5 in one run; Playwright and Robot pinned; the two-lane plan for each seeded defect, partial success, timeouts, cancellation and a killed parent with process checks; a missing dependency fails, never skips)
    # The product's end-to-end path: one frozen plan, two real engines, serially, one run id, one evidence bundle, for the clean target and each seeded defect, run through the
    # command line in a scrubbed environment too. Read-only, no secret; the browser is installed in its own prefetch step and nothing downloads at test time.
    runs-on: ubuntu-24.04
    needs: pins
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - name: Verify the fetched trees are exactly the pins (HEAD, clean, tree digest, vector digests)
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --verify-trees --require-git
      - name: Install the pinned test tools, Playwright and Robot Framework
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7" "playwright==1.64.1" "robotframework==7.5"
      - name: Browser install (prefetch; no credentials; the tests never download anything)
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers" python -m playwright install --with-deps chromium
      - name: Fail unless the pinned Playwright and Robot Framework are importable
        run: python -c "import importlib.metadata as m, playwright.sync_api, robot; assert m.version('playwright') == '1.64.1', m.version('playwright'); assert m.version('robotframework') == '7.5', m.version('robotframework')"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the runner end-to-end lane (scrubbed environment; only tests marked e2e)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            python -m pytest -q -m e2e packages/qa-runner/tests/e2e --junitxml="$RUNNER_TEMP/junit-runner-e2e.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-runner-e2e.xml"
      - name: Fail if the tests left anything in the working tree
        run: test -z "$(git status --porcelain)"

  bundle-tests:
    name: bundle tools and install scripts (offline; the builder's parts, the checker, install, uninstall, rollback and every refusal against synthetic wheels, the pinned-trees wheel, the workflow guards; no skips, at least one test)
    # No network after the pinned trees are fetched: the tests build bundles of synthetic wheels with the real builder functions and run the real scripts with the real bash, venv and pip
    # (--no-index). The workflow guard tests, which no job ran before, run here too. Read-only, no secret.
    runs-on: ubuntu-24.04
    needs: pins
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - name: Verify the fetched trees are exactly the pins (HEAD, clean, tree digest, vector digests)
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --verify-trees --require-git
      - name: Install test tools
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the bundle and workflow tests in a scrubbed environment
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q tests/test_bundle_builder.py tests/test_bundle_install.py tests/test_bundle_pinned.py tests/test_bundle_workflow.py tests/test_demo_outcome.py tests/test_workflow.py \
              --junitxml="$RUNNER_TEMP/junit-bundle-tests.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-bundle-tests.xml"
      - name: Fail if the tests left anything in the working tree
        run: test -z "$(git status --porcelain)"

  bundle:
    name: bundle (CPython 3.12, linux x86_64; built twice from the same commit and compared; checked; the archives are kept as workflow artifacts)
    # Builds the pinned bundle exactly as the manual workflow does, builds it a second time with an empty download cache and compares SHA256SUMS and the archive digest (the result is printed
    # whatever it is), and builds a differently labelled one to stand in for "the previous bundle" of the rollback check. Network: the pinned, hash-checked wheels only. Read-only, no secret.
    runs-on: ubuntu-24.04
    needs: pins
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - name: Verify the fetched trees are exactly the pins (HEAD, clean, tree digest, vector digests)
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --verify-trees --require-git
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Build the bundle
        run: python tools/build_bundle.py build --out "$RUNNER_TEMP/build-1" --download-cache "$RUNNER_TEMP/cache-1"
      - name: Build it again from the same commit with an empty download cache, and compare
        run: |
          python tools/build_bundle.py build --out "$RUNNER_TEMP/build-2" --download-cache "$RUNNER_TEMP/cache-2"
          a="$(ls "$RUNNER_TEMP"/build-1/*.tar)"; b="$(ls "$RUNNER_TEMP"/build-2/*.tar)"
          echo "build 1 SHA256SUMS sha256: $(sha256sum "$RUNNER_TEMP"/build-1/*/SHA256SUMS | cut -d' ' -f1)"
          echo "build 2 SHA256SUMS sha256: $(sha256sum "$RUNNER_TEMP"/build-2/*/SHA256SUMS | cut -d' ' -f1)"
          echo "build 1 archive sha256: $(sha256sum "$a" | cut -d' ' -f1)"
          echo "build 2 archive sha256: $(sha256sum "$b" | cut -d' ' -f1)"
          if diff -u "$RUNNER_TEMP"/build-1/*/SHA256SUMS "$RUNNER_TEMP"/build-2/*/SHA256SUMS && cmp "$a" "$b"; then
            echo "REPRODUCIBILITY: two builds of this commit on this runner are byte for byte identical (SHA256SUMS and the archive)"
          else
            echo "REPRODUCIBILITY: the two builds differ (see the diff above)"; exit 1
          fi
      - name: Build the bundle that stands in for the previous one (another label, so another digest)
        run: python tools/build_bundle.py build --out "$RUNNER_TEMP/build-previous" --label rollback-previous --download-cache "$RUNNER_TEMP/cache-1"
      - name: Check both bundles with the standalone checker (a clean interpreter, away from the checkout)
        run: |
          cd "$RUNNER_TEMP"
          for d in build-1 build-previous; do python -I "$GITHUB_WORKSPACE/tools/check_bundle.py" "$RUNNER_TEMP/$d"/redevops-qa-bundle-*-cp312-linux-x86_64; done
      - name: Print the digest of the archive (the value to compare a download with)
        run: |
          sha256sum "$RUNNER_TEMP"/build-1/*.tar
          cat "$RUNNER_TEMP"/build-1/*.tar.sha256
      - name: Keep the bundle (a workflow artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: qa-bundle-current
          path: |
            ${{ runner.temp }}/build-1/*.tar
            ${{ runner.temp }}/build-1/*.tar.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Keep the previous-bundle stand-in
        uses: actions/upload-artifact@v4
        with:
          name: qa-bundle-previous
          path: |
            ${{ runner.temp }}/build-previous/*.tar
            ${{ runner.temp }}/build-previous/*.tar.sha256
          if-no-files-found: error
          retention-days: 14

  bundle-install:
    name: bundle install on a clean runner (the README commands unchanged, doctor, demo, rollback, uninstall, directory clean; a tampered wheel, a wrong lock, another Python and another platform are refused)
    # A fresh ubuntu-24.04 machine that has not built anything: it downloads the archives the bundle job kept and runs tools/bundle_acceptance.sh, which takes the commands from the bundle's own README
    # and runs them as written. The browser step downloads Chromium (not part of the bundle). Read-only, no secret.
    runs-on: ubuntu-24.04
    needs: bundle
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the bundle
        uses: actions/download-artifact@v4
        with:
          name: qa-bundle-current
          path: ${{ runner.temp }}/current
      - name: Download the previous-bundle stand-in
        uses: actions/download-artifact@v4
        with:
          name: qa-bundle-previous
          path: ${{ runner.temp }}/previous
      - name: Run the acceptance script
        run: bash tools/bundle_acceptance.sh --current "$RUNNER_TEMP/current" --previous "$RUNNER_TEMP/previous"
      - name: Fail if the run left anything in the working tree
        run: test -z "$(git status --porcelain)"

  demo:
    name: demo ${{ matrix.defect }} (the installed bundle on a clean runner; expected exit status ${{ matrix.exit }}; the evidence bundle is kept and the anchor printed)
    # The product's public demonstration, three times: against the correct fixture app (VERIFIED, exit 0), with the seeded discount defect (the Robot lane fails, exit 1) and with the seeded
    # settings defect (the Playwright lane fails, exit 1). The bundle is installed with the commands of its own README, as a user would; the browser step downloads Chromium. The anchor
    # printed here is the sha256 of the bundle's manifest: this log and the kept artifact are where it is recorded; nothing in the bundle authenticates it. Read-only, no secret.
    runs-on: ubuntu-24.04
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - defect: none
            exit: 0
          - defect: discount
            exit: 1
          - defect: settings
            exit: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the bundle
        uses: actions/download-artifact@v4
        with:
          name: qa-bundle-current
          path: ${{ runner.temp }}/current
      - name: Take the commands out of the README inside the archive
        run: |
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/blocks"
          cp "$RUNNER_TEMP"/current/*.tar "$RUNNER_TEMP"/current/*.tar.sha256 "$RUNNER_TEMP/dl/"
          name="$(basename "$(ls "$RUNNER_TEMP"/dl/*.tar)" .tar)"
          tar xOf "$RUNNER_TEMP/dl/$name.tar" "$name/README.md" > "$RUNNER_TEMP/blocks/README.md"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - name: Install the bundle with the README commands (unpack, install, browser step)
        run: |
          { echo "set -euo pipefail"; python tools/readme_block.py "$RUNNER_TEMP/blocks/README.md" unpack; python tools/readme_block.py "$RUNNER_TEMP/blocks/README.md" install; } > "$RUNNER_TEMP/blocks/install.sh"
          cat "$RUNNER_TEMP/blocks/install.sh"
          cd "$RUNNER_TEMP/dl" && bash "$RUNNER_TEMP/blocks/install.sh"
      - name: Run the demo (the exit status is checked in the next step)
        env:
          DEFECT: ${{ matrix.defect }}
        run: |
          status=0
          "$HOME/redevops-qa/bin/redevops-qa" demo --defect "$DEFECT" --out "$RUNNER_TEMP/evidence" > "$RUNNER_TEMP/demo.out" 2>&1 || status=$?
          cat "$RUNNER_TEMP/demo.out"
          echo "demo exit status: $status"
          echo "STATUS=$status" >> "$GITHUB_ENV"
      - name: Check the outcome against the seeded defect and print the anchor
        env:
          DEFECT: ${{ matrix.defect }}
        run: |
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/tools/check_demo_outcome.py" run --defect "$DEFECT" --exit-code "$STATUS" --output "$RUNNER_TEMP/demo.out" \
            --evidence-root "$RUNNER_TEMP/evidence" --anchor-out "$RUNNER_TEMP/anchor/anchor-$DEFECT.txt" > "$RUNNER_TEMP/anchor.out"
          cat "$RUNNER_TEMP/anchor.out"
          { echo "### demo $DEFECT"; echo; echo '```'; cat "$RUNNER_TEMP/anchor.out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-evidence-${{ matrix.defect }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 14
      - name: Keep the anchor
        uses: actions/upload-artifact@v4
        with:
          name: demo-anchor-${{ matrix.defect }}
          path: ${{ runner.temp }}/anchor/anchor-${{ matrix.defect }}.txt
          if-no-files-found: error
          retention-days: 14

  demo-verify:
    name: demo ${{ matrix.defect }} re-verified in a second job (a fresh machine, a fresh virtual environment, the kept bundle and the printed anchor; a changed bundle and a wrong anchor are refused)
    # Starts from nothing but the kept artifacts: it installs the bundle into a new directory (no browser step: verification needs none), downloads the evidence bundle and the anchor the demo job
    # kept, and runs `redevops-qa verify` with the anchor and the plan digest, which must be accepted with the exit status the run had. Then the same command on a copy with one byte added to
    # report.json, and with a wrong anchor, must refuse (exit status 5). Read-only, no secret.
    runs-on: ubuntu-24.04
    needs: [bundle, demo]
    strategy:
      fail-fast: false
      matrix:
        include:
          - defect: none
            exit: 0
          - defect: discount
            exit: 1
          - defect: settings
            exit: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the bundle
        uses: actions/download-artifact@v4
        with:
          name: qa-bundle-current
          path: ${{ runner.temp }}/current
      - name: Take the commands out of the README inside the archive
        run: |
          mkdir -p "$RUNNER_TEMP/dl" "$RUNNER_TEMP/blocks"
          cp "$RUNNER_TEMP"/current/*.tar "$RUNNER_TEMP"/current/*.tar.sha256 "$RUNNER_TEMP/dl/"
          name="$(basename "$(ls "$RUNNER_TEMP"/dl/*.tar)" .tar)"
          tar xOf "$RUNNER_TEMP/dl/$name.tar" "$name/README.md" > "$RUNNER_TEMP/blocks/README.md"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - name: Install the bundle into a new directory (unpack, install; no browser)
        run: |
          { echo "set -euo pipefail"; python tools/readme_block.py "$RUNNER_TEMP/blocks/README.md" unpack; echo './install.sh --prefix "$RUNNER_TEMP/verifier"'; } > "$RUNNER_TEMP/blocks/install.sh"
          cd "$RUNNER_TEMP/dl" && bash "$RUNNER_TEMP/blocks/install.sh"
      - name: Download the evidence bundle the demo kept
        uses: actions/download-artifact@v4
        with:
          name: demo-evidence-${{ matrix.defect }}
          path: ${{ runner.temp }}/evidence
      - name: Download the anchor the demo kept
        uses: actions/download-artifact@v4
        with:
          name: demo-anchor-${{ matrix.defect }}
          path: ${{ runner.temp }}/anchor
      - name: Verify the bundle with the anchor and the plan digest
        env:
          DEFECT: ${{ matrix.defect }}
          EXPECTED: ${{ matrix.exit }}
        run: |
          cd "$RUNNER_TEMP"
          anchor="$(grep '^anchor=' "anchor/anchor-$DEFECT.txt" | cut -d= -f2)"
          plan="$(grep '^plan_digest=' "anchor/anchor-$DEFECT.txt" | cut -d= -f2)"
          bundle="$(ls -d "$RUNNER_TEMP"/evidence/r0-*)"
          echo "anchor $anchor"; echo "plan digest $plan"
          status=0
          "$RUNNER_TEMP/verifier/bin/redevops-qa" verify "$bundle" --anchor "$anchor" --plan-digest "$plan" --require-anchor --require-plan-digest --json > "$RUNNER_TEMP/verify.json" || status=$?
          echo "verify exit status: $status (expected $EXPECTED)"
          python -I "$GITHUB_WORKSPACE/tools/check_demo_outcome.py" verify --defect "$DEFECT" --exit-code "$status" --result "$RUNNER_TEMP/verify.json"
      - name: A bundle with one byte added to its report is refused
        run: |
          cd "$RUNNER_TEMP"
          cp -R "$(ls -d "$RUNNER_TEMP"/evidence/r0-*)" "$RUNNER_TEMP/changed"
          printf 'x' >> "$RUNNER_TEMP/changed/report.json"
          status=0
          "$RUNNER_TEMP/verifier/bin/redevops-qa" verify "$RUNNER_TEMP/changed" || status=$?
          echo "verify exit status on the changed copy: $status"
          test "$status" -eq 5
      - name: A wrong anchor is refused
        run: |
          cd "$RUNNER_TEMP"
          status=0
          "$RUNNER_TEMP/verifier/bin/redevops-qa" verify "$(ls -d "$RUNNER_TEMP"/evidence/r0-*)" --anchor "sha256:$(printf '0%.0s' $(seq 64))" --require-anchor || status=$?
          echo "verify exit status with a wrong anchor: $status"
          test "$status" -eq 5

  bridge:
    name: bridge tests (${{ matrix.pin_set }}; exact pins, no skips, at least one test)
    runs-on: ubuntu-24.04
    needs: pins
    strategy:
      fail-fast: false
      matrix:
        pin_set: [c3, c4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --pin-set "${{ matrix.pin_set }}" --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - name: Verify the fetched trees are exactly the pins (HEAD, clean, tree digest, vector digests)
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --pin-set "${{ matrix.pin_set }}" --verify-trees --require-git
      - name: Install test tools (the pinned trees are imported from their paths, not installed)
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the bridge and repository tests in a scrubbed environment (the conformance suite has its own job)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            REDEVOPS_QA_PIN_SET="${{ matrix.pin_set }}" \
            python -m pytest -q --ignore=packages/qa-bridge/tests/conformance --junitxml=junit-bridge.xml
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py junit-bridge.xml

  conformance:
    name: conformance (${{ matrix.pin_set }}; release-critical, never skipped)
    runs-on: ubuntu-24.04
    needs: pins
    strategy:
      fail-fast: false
      matrix:
        pin_set: [c3, c4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --pin-set "${{ matrix.pin_set }}" --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - name: Verify the fetched trees are exactly the pins (HEAD, clean, tree digest, vector digests)
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --pin-set "${{ matrix.pin_set }}" --verify-trees --require-git
      - name: Install test tools
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Output directory outside the checkout (the receipt requires a clean working tree)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
      - name: Run the conformance suite and write the compat-receipt/1
        # A missing or inexact dependency, zero collected tests, any skip, a dirty tree and any failed check all give a non-zero exit.
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/qa-bridge/src \
            REDEVOPS_QA_PIN_SET="${{ matrix.pin_set }}" QA_CI_WORKFLOW="${{ github.workflow }}" QA_CI_RUN_ID="${{ github.run_id }}" \
            python -m redevops_qa_bridge.conformance.cli run --receipt "$OUT/compat-receipt-${{ matrix.pin_set }}.json" \
              --report "$OUT/divergence-report-${{ matrix.pin_set }}.json" --report-md "$OUT/divergence-report-${{ matrix.pin_set }}.md" \
              --junit "$OUT/junit-conformance-${{ matrix.pin_set }}.xml"
      - name: Fail on zero collected tests or any skip (second, independent check of the JUnit report)
        run: python tools/check_junit.py "$OUT/junit-conformance-${{ matrix.pin_set }}.xml"
      - name: Verify the receipt (hash, consistency, not stale; c4 must list no not-applicable item)
        run: |
          flag=""
          if [ "${{ matrix.pin_set }}" = "c4" ]; then flag="--forbid-not-applicable"; fi
          env -i HOME="$(mktemp -d)" PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=packages/qa-bridge/src \
            REDEVOPS_QA_PIN_SET="${{ matrix.pin_set }}" \
            python -m redevops_qa_bridge.conformance.cli verify "$OUT/compat-receipt-${{ matrix.pin_set }}.json" $flag
      - name: Upload the receipt and the divergence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-receipt-${{ matrix.pin_set }}
          path: |
            ${{ runner.temp }}/out/compat-receipt-${{ matrix.pin_set }}.json
            ${{ runner.temp }}/out/divergence-report-${{ matrix.pin_set }}.json
            ${{ runner.temp }}/out/divergence-report-${{ matrix.pin_set }}.md
          if-no-files-found: error

  browser:
    name: browser lane (real Chromium; Playwright pinned; a missing Playwright or browser fails, never skips)
    # The only job that installs Playwright and a browser. The offline jobs above never collect tests/browser (pytest's
    # norecursedirs and the explicit paths below). Read-only, no secret, no token input; the browser is installed in its own
    # prefetch step with no credentials and the tests then run against a fixture served from loopback by the test itself.
    runs-on: ubuntu-24.04
    needs: pins
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the pinned commits
        id: pins
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --github-output >> "$GITHUB_OUTPUT"
      - name: Fetch runtime-contracts at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.contracts_repo }}
          ref: ${{ steps.pins.outputs.contracts_commit }}
          path: ${{ steps.pins.outputs.contracts_path }}
          persist-credentials: false
      - name: Fetch agent-harness at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pins.outputs.harness_qa_repo }}
          ref: ${{ steps.pins.outputs.harness_qa_commit }}
          path: ${{ steps.pins.outputs.harness_qa_path }}
          persist-credentials: false
      - name: Verify the fetched trees are exactly the pins (HEAD, clean, tree digest, vector digests)
        run: PYTHONPATH=packages/qa-bridge/src python -m redevops_qa_bridge.pins --verify-trees --require-git
      - name: Install the pinned test tools and Playwright
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7" "playwright==1.64.1"
      - name: Browser install (prefetch; no credentials; the tests never download anything)
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers" python -m playwright install --with-deps chromium
      - name: Fail unless the pinned Playwright is importable
        run: python -c "import importlib.metadata as m, playwright.sync_api; assert m.version('playwright') == '1.64.1', m.version('playwright')"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the browser lane (scrubbed environment; only tests marked browser)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            python -m pytest -q -m browser packages/qa-playwright/tests/browser packages/qa-egress/tests/browser --junitxml="$RUNNER_TEMP/junit-browser.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-browser.xml"

  capabilities:
    name: "capability manifest (qa-capabilities.json - schema, pins, evidence, adapter agreement, freshness against main, generated document; offline; never skipped)"
    # Runs on every push and pull request, with no path filter, no condition and no dependency on another job, so it cannot be skipped. Offline, read-only,
    # no secret. It needs the full history (the freshness rule: every verified commit must be an ancestor of main). The full jsonschema package is
    # installed only to cross-check the strict validator the offline tests use; a missing package fails the step.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools and the cross-check validator
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7" "jsonschema==4.26.0"
      - name: Check the manifest (schema, pins, evidence, adapter agreement, document, freshness against main) and cross-check the validator
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 python tools/check_capabilities.py --cross-check
      - name: Run the manifest and validator tests in a scrubbed environment
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q tests/test_capabilities.py tests/test_qa_jsonschema.py --junitxml="$RUNNER_TEMP/junit-capabilities.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-capabilities.xml"

  selenium-offline:
    name: "selenium adapter (offline - fake browser, recorded pytest JUnit reports, real pytest under the supervisor; no Selenium installed)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the offline Selenium adapter tests in a scrubbed environment
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -q packages/qa-selenium/tests --junitxml="$RUNNER_TEMP/junit-selenium-offline.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-selenium-offline.xml"

  selenium-browser:
    name: selenium browser lane (real Chrome and ChromeDriver; Selenium pinned; NOT a required check until proven; a missing dependency fails, never skips)
    # The only job that installs Selenium. It needs the runner's Chrome and ChromeDriver and never downloads a browser or a driver
    # (the adapter passes the driver path explicitly, so Selenium Manager is not used). Read-only, no secret. The tests run against a
    # page the test serves from loopback.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned test tools and Selenium
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7" "selenium==4.52.0"
      - name: Locate the runner's Chrome and ChromeDriver (fail when either is missing)
        run: |
          chrome="$(command -v google-chrome || true)"
          driver=""
          if [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then driver="$CHROMEWEBDRIVER/chromedriver"; fi
          if [ -z "$driver" ]; then driver="$(command -v chromedriver || true)"; fi
          if [ ! -x "$chrome" ] || [ ! -x "$driver" ]; then echo "FAIL: Chrome ($chrome) or ChromeDriver ($driver) is missing on this runner"; exit 1; fi
          "$chrome" --version
          "$driver" --version
          echo "QA_CHROME_BINARY=$chrome" >> "$GITHUB_ENV"
          echo "QA_CHROMEDRIVER_PATH=$driver" >> "$GITHUB_ENV"
      - name: Fail unless the pinned Selenium is importable
        run: python -c "import importlib.metadata as m, selenium; assert m.version('selenium') == '4.52.0', m.version('selenium')"
      - name: Fail if the working tree is dirty
        run: test -z "$(git status --porcelain)"
      - name: Run the browser lane (scrubbed environment; only tests marked browser)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            QA_CHROME_BINARY="$QA_CHROME_BINARY" QA_CHROMEDRIVER_PATH="$QA_CHROMEDRIVER_PATH" \
            python -m pytest -q -m browser packages/qa-selenium/tests/browser --junitxml="$RUNNER_TEMP/junit-selenium-browser.xml"
      - name: Fail on zero collected tests or any skip
        run: python tools/check_junit.py "$RUNNER_TEMP/junit-selenium-browser.xml"

  robot-offline:
    name: "robot adapter (offline - recorded output.xml from real runs, allowlist, strict import; no Robot Framework installed)"
    runs-on: ubuntu-24.04
    steps:
