# Secret scanning (audit item P0-6): both scanners run over the FULL public history (`--all`), on every push and
# pull request and once a week, so a secret added to any branch is caught by the next job, not only by the next
# merge. Tools are pinned by exact version AND sha256 of the exact release archive — this workflow downloads two
# executables and runs them, so nothing here floats. Read-only and secret-free like tests.yml: no tag trigger,
# no publish step, no secret and no token input. Nothing is ever excluded from a scan: the two gitleaks false
# positives are ignored per line in .gitleaksignore, and every trufflehog finding must appear in
# tools/trufflehog_baseline.txt with its own justification, or the job fails (tools/check_trufflehog_baseline.py).
# Baseline re-measured on the default branch on 2026-11-11: gitleaks 8.30.1 — 2 findings, both false positives,
# both ignored with justification; trufflehog 3.99.8 — 0 verified and 5 unverified findings, all false positives in
# test fixtures and one deny-list digest, each allow-listed by detector, file and redacted-match digest. An earlier
# record here claimed a clean trufflehog run; that figure was not reproducible on a fresh clone and is superseded by
# this one, which is what the job enforces.
name: secret-scan

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly, in case a scanner release starts seeing what older runs missed

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks over the full history (every ref; .gitleaksignore must stay justified line by line)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0          # full history on every ref — the whole point of the job
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (pinned by version and by the sha256 of the exact archive)
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          ./gitleaks version
      - name: Scan every commit of every ref; findings fail the job (secrets are redacted in the log)
        run: ./gitleaks git . --log-opts="--all" --redact

  trufflehog:
    name: trufflehog over the full history (every finding must be justified; the scan itself is never narrowed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install trufflehog 3.99.8 (pinned by version and by the sha256 of the exact archive)
        run: |
          set -euo pipefail
          curl -fsSLO https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.8/trufflehog_3.99.8_linux_amd64.tar.gz
          echo "7c3b02f160f28929a467e29e20fba98746e0729f6e37c3c25761e4f8789abe08  trufflehog_3.99.8_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf trufflehog_3.99.8_linux_amd64.tar.gz trufflehog
          ./trufflehog --version
      # The scan covers every tracked file and every commit of every ref: no --exclude-paths, no --only-verified,
      # no --exclude-globs. --fail still runs: trufflehog exits 0 with no findings and 183 with findings, and the
      # gate then requires every finding to appear in tools/trufflehog_baseline.txt with a justification, fails on
      # anything else, and fails on an allow-list entry that silences nothing. Any other exit status is a scan that
      # did not complete, which is a failure, not a pass.
      - name: Scan the whole repository and gate every finding
        run: |
          set -uo pipefail
          ./trufflehog git file://. --fail --no-update --json > "$RUNNER_TEMP/trufflehog.json" 2> "$RUNNER_TEMP/trufflehog.err"
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 183 ]; then
            echo "trufflehog exited $status — neither 0 (clean) nor 183 (findings), so the scan did not complete" >&2
            tail -20 "$RUNNER_TEMP/trufflehog.err" >&2
            exit "$status"
          fi
          python3 tools/check_trufflehog_baseline.py --json "$RUNNER_TEMP/trufflehog.json" --allow tools/trufflehog_baseline.txt --exit-status "$status" --stderr "$RUNNER_TEMP/trufflehog.err"
      - name: Record the scan volume so a silently short scan is visible in the log
        if: always()
        run: |
          set -uo pipefail
          grep -o '"chunks": *[0-9]*' "$RUNNER_TEMP/trufflehog.json" 2>/dev/null | tail -1 || echo "no summary line in the trufflehog output"
          grep -o '"bytes": *[0-9]*' "$RUNNER_TEMP/trufflehog.json" 2>/dev/null | tail -1 || true