      - {file: selenium/webdriver/common/selenium-manager-THIRD-PARTY-NOTICES.txt, sha256: "d526cf9b9c797f13db03756fba05ef775dc8d30d143dd0b3f568c6cc9320bf28", content: "third-party notices for the bundled selenium-manager binary, shipped inside the wheel"}
