# SPDX-License-Identifier: LicenseRef-AGPL-3.0-or-later-with-Commons-Clause
#
# Licence matrix for the optional execution-adapter frameworks (Selenium, Robot Framework, Appium) and the packages and
# toolchains around them. Technical triage, not legal advice.
#
# What it is: a record of what each framework is, at which pinned release, under which licence, what it brings with it, and
# whether ReDevOps may ship it. tools/check_adapter_licenses.py (run by the `adapter-licences` CI job and by
# tests/test_adapter_license_matrix.py) fails on an unknown or incompatible redistributable, on a package that an adapter
# package or a workflow installs but this file does not list, and on a pin that disagrees with this file.
#
# What it is not: a legal opinion, and not a statement about any version other than the pinned one. Every fact carries a
# `verification` block. `verified` means the upstream LICENSE file at the pinned tag (or, for the two commercial terms, the
# vendor page) was fetched and read on the date given. `registry-metadata` means only the licence field of the package
# registry was read, for the latest version on that date, not for the pinned one. `unverified` means nothing was checked and
# no claim is made. A fact that is `unverified` never supports a redistribution status.
#
# Third-party content inside a shipped wheel (the Node.js runtime and the inlined npm packages of the Playwright driver; the
# Robot Framework report assets and libdoc.html) is recorded under `third_party_evidence`, one item per component, and the
# item's status says exactly what was established:
#   verified       the exact component and version were identified from the shipped bytes (`identified_by`), and for every
#                  `sources` entry the URL, the retrieval date and the sha256 of what was fetched are recorded, with a licence
#                  text that ships in the bundle's THIRD_PARTY_NOTICES tree (`licence_texts`: ids of
#                  third_party/notices/notices.lock.json). It records facts; it decides nothing about distribution.
#   declared_only  a primary source declares a licence but publishes no licence text (`licence_text_absent`), so no text can be
#                  shipped; `options` lists what the owner can do.
#   unverified     nothing could be established (`reason`).
# `redistribution.public_distribution_blockers` lists every item that is not `verified`. `public_distribution` stays
# owner_decision_required whatever the items say: whether the facts are acceptable is the owner's decision, not this file's.
# tools/check_adapter_licenses.py fails on a verified item without its evidence fields and on a licence-bearing file in a shipped wheel that is not recorded.
#
# Owner decisions (2026-11-03). Every shipped component and every evidence item has an `owner_decision` block. `none yet` means the owner has not decided. A recorded decision has a date,
# `decided_by: owner` and conditions; each condition has a `kind` the checker evaluates from this file, the notices lock and the repository (notices_shipped, residuals_retained, documented,
# declaration_verified, table_section) and a recorded `status` that must equal the computed one. A decision whose condition is not evidenced is a finding. `bundle_public_distribution` lists the
# shipped items without a settled decision and stays owner_decision_required: this file never decides distribution for the owner.
#
# Redistribution statuses (redistribution.status):
#   redistributable     ReDevOps may include it in an artifact it publishes. Requires: every licence involved allowed by the
#                       policy below, licence text verified at the pinned tag, bundled content inspected, notices recorded.
#   optional_extra      Not shipped by ReDevOps. The operator installs it from the package registry at the pinned version.
#   excluded_by_default Not shipped, not installed and not downloaded by default (commercial SDKs, Apple toolchains, anything
#                       whose licence the policy blocks).
#   unverified          No claim is made either way.
#   staged_unmodified   Shipped UNMODIFIED inside the pinned bundle (bundle/, built by tools/build_bundle.py) as the wheel named under
#                       `shipped_wheels`, with the licence and notice files that wheel carries. PRIVATE STAGING ONLY: public
#                       distribution requires an owner decision (redistribution.public_distribution = owner_decision_required).
#                       tools/check_adapter_licenses.py requires every wheel of bundle/third-party.lock.json to appear here with the
#                       same name, version, file name and sha256, and refuses a shipped wheel under any other status.
#
# Adapter manifests, contracts and the frozen qa/v1 goldens are not touched by this file.
schema: redevops-qa/adapter-license-matrix
version: 1
checked_on: "2026-11-03"
policy:
  # Licence identifiers (SPDX) the policy accepts for a redistributable artifact. An expression with OR passes when one
  # alternative passes; AND needs every part.
  allowed_spdx: [Apache-2.0, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, ISC, PSF-2.0, 0BSD, BlueOak-1.0.0, Zlib, Unlicense, CC0-1.0]
  # Never redistributable without a separate human review, so never `redistributable` here.
  review_spdx: [MPL-2.0, Unicode-3.0, CDLA-Permissive-2.0, BSL-1.0, bzip2-1.0.6, LGPL-2.1-or-later, LGPL-3.0-only,
                LGPL-3.0-or-later, EPL-2.0, CC-BY-4.0, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later]
  # Incompatible with how this repository is licensed and used. Anything neither listed nor an exception below is treated as blocked.
  blocked_spdx: [GPL-2.0-only, SSPL-1.0, BUSL-1.1, Elastic-2.0, CC-BY-NC-4.0]
  blocked_prefixes: ["LicenseRef-Proprietary", "LicenseRef-Commons-Clause"]
  allowed_exceptions: [LLVM-exception]
  # Distribution names that CI and the adapter packages may install without being adapter frameworks. (pyyaml is also shipped in the bundle: see pyyaml-shipped.)
  ci_tooling: [pytest, pyyaml, jsonschema]
inventory:
  method: "How the inventory of shipped third-party material is derived (third_party/README.md): the notice files each wheel carries; the Playwright lock file and import statements at the pinned tag for the packages the vite bundles and coreBundle.js resolve (third_party/evidence/playwright-*-import-candidates.json, made by tools/collect_licence_evidence.py import-candidates); a licence/copyright header scan of every text file in the Playwright and Robot Framework wheels (tools/check_adapter_licenses.py --wheelhouse, tools/collect_licence_evidence.py inventory); the sections of the Node.js LICENSE; and manual reading of what those leave open."
  limits: "BEST EFFORT. It cannot prove completeness: a minified file whose comments were stripped, a library without a notice or header, data inlined as an opaque string, and code that Playwright's sources reach through a path the import scan does not follow are not found. The checker fails on what the scans find that no item covers; it never claims that nothing else is shipped."
  import_candidates: {path: "third_party/evidence/playwright-1.64.1-import-candidates.json", sha256: "9bb7e985653bf32f06ae55a53b41e9688c8391cb6b5000aaf8b0c6108460b942"}
  own_holders: ["microsoft corp", "robot framework", "nokia networks"]
  excluded_packages:
    vite: "build tool of the vite applications; its output is the bundles, vite itself is not inlined"
    "@vitejs/plugin-react": "build plugin; not inlined"
    electron: "development dependency used for types and tests of the Electron integration; not in the wheel"
    chromium-bidi: "required at run time by path (chromium-bidi/lib/cjs/...) from coreBundle.js; the package is not inlined and not in the wheel (no code of it in the wheel, only the two specifier strings)"
bundle_public_distribution:
  status: owner_decision_required
  reason: "the owner decides public distribution of the bundle once every shipped third-party item has a decision; this file records facts and the decisions taken so far and decides nothing on its own"
  pending_decisions: [playwright-python, playwright-python-direct-deps, pw-npm-inlined, pw-vendored-sources, pw-vite-browser-logos, pw-vite-codemirror, pw-vite-codicon, pw-vite-react, pw-vite-vscode-css, pw-vite-xterm, pw-vite-yaml, pw-vite-zipjs, pw-webp-codec, pw-xdg-open, pyyaml-shipped, rf-asserts-unittest, rf-highlighting-burgaud, rf-htmldog-tabs, rf-jquery-3.5.1, rf-jquery-highlight, rf-jquery-tmpl, rf-jsxcompressor, rf-libdoc-handlebars, rf-libdoc-mark-js, rf-libdoc-parcel-runtime, rf-libdoc-source-map, rf-open-iconic, robotframework, typing-extensions-shipped]
