# SPDX-License-Identifier: LicenseRef-AGPL-3.0-or-later-with-Commons-Clause
#
# Licence matrix for the optional execution-adapter frameworks (Selenium, Robot Framework, Appium) and the packages and
# toolchains around them. Technical triage, not legal advice.
#
# What it is: a record of what each framework is, at which pinned release, under which licence, what it brings with it, and
# whether ReDevOps may ship it. tools/check_adapter_licenses.py (run by the `adapter-licences` CI job and by
# tests/test_adapter_license_matrix.py) fails on an unknown or incompatible redistributable, on a package that an adapter
# package or a workflow installs but this file does not list, and on a pin that disagrees with this file.
#
# What it is not: a legal opinion, and not a statement about any version other than the pinned one. Every fact carries a
# `verification` block. `verified` means the upstream LICENSE file at the pinned tag (or, for the two commercial terms, the
# vendor page) was fetched and read on the date given. `registry-metadata` means only the licence field of the package
# registry was read, for the latest version on that date, not for the pinned one. `unverified` means nothing was checked and
# no claim is made. A fact that is `unverified` never supports a redistribution status.
#
# Redistribution statuses (redistribution.status):
#   redistributable     ReDevOps may include it in an artifact it publishes. Requires: every licence involved allowed by the
#                       policy below, licence text verified at the pinned tag, bundled content inspected, notices recorded.
#   optional_extra      Not shipped by ReDevOps. The operator installs it from the package registry at the pinned version.
#   excluded_by_default Not shipped, not installed and not downloaded by default (commercial SDKs, Apple toolchains, anything
#                       whose licence the policy blocks).
#   unverified          No claim is made either way.
#   staged_unmodified   Shipped UNMODIFIED inside the pinned bundle (bundle/, built by tools/build_bundle.py) as the wheel named under
#                       `shipped_wheels`, with the licence and notice files that wheel carries. PRIVATE STAGING ONLY: public
#                       distribution requires an owner decision (redistribution.public_distribution = owner_decision_required).
#                       tools/check_adapter_licenses.py requires every wheel of bundle/third-party.lock.json to appear here with the
#                       same name, version, file name and sha256, and refuses a shipped wheel under any other status.
#
# Adapter manifests, contracts and the frozen qa/v1 goldens are not touched by this file.
schema: redevops-qa/adapter-license-matrix
version: 1
checked_on: "2026-10-31"
policy:
  # Licence identifiers (SPDX) the policy accepts for a redistributable artifact. An expression with OR passes when one
  # alternative passes; AND needs every part.
  allowed_spdx: [Apache-2.0, MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, ISC, PSF-2.0, 0BSD, BlueOak-1.0.0, Zlib, Unlicense, CC0-1.0]
  # Never redistributable without a separate human review, so never `redistributable` here.
  review_spdx: [MPL-2.0, Unicode-3.0, CDLA-Permissive-2.0, BSL-1.0, bzip2-1.0.6, LGPL-2.1-or-later, LGPL-3.0-only,
                LGPL-3.0-or-later, EPL-2.0, CC-BY-4.0, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later]
  # Incompatible with how this repository is licensed and used. Anything neither listed nor an exception below is treated as blocked.
  blocked_spdx: [GPL-2.0-only, SSPL-1.0, BUSL-1.1, Elastic-2.0, CC-BY-NC-4.0]
  blocked_prefixes: ["LicenseRef-Proprietary", "LicenseRef-Commons-Clause"]
  allowed_exceptions: [LLVM-exception]
  # Distribution names that CI and the adapter packages may install without being adapter frameworks. (pyyaml is also shipped in the bundle: see pyyaml-shipped.)
  ci_tooling: [pytest, pyyaml, jsonschema]
