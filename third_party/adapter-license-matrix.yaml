    license_file_sha256: "307012b4481479a56605420e81db14686a0274d246d06d224c363ee09297d330"
    notices:
      - {file: NOTICE, url: "https://github.com/SeleniumHQ/selenium/blob/selenium-4.52.0/NOTICE", sha256: "0967977ac7278caa64ddd9369e831f4edc7baaca60b35efdfa9edb1e328455d2", content: "copyright lines of the Software Freedom Conservancy and the Selenium committers"}
      - {file: selenium/webdriver/common/selenium-manager-THIRD-PARTY-NOTICES.txt, sha256: "d526cf9b9c797f13db03756fba05ef775dc8d30d143dd0b3f568c6cc9320bf28", content: "third-party notices for the bundled selenium-manager binary, shipped inside the wheel"}
    artifacts:
      - {ecosystem: pypi, name: selenium, version: "4.52.0", file: selenium-4.52.0-py3-none-any.whl, sha256: "caa2860d486f71cdeb21fee3248c2f604bba590120dfb4d3d18c4d7cf97c6f1f"}
    bundled_deps_check: inspected
    bundled_deps:
      - {name: "selenium-manager (prebuilt binaries for linux x86_64, linux arm64, macos, windows)", spdx: Apache-2.0, note: "built from the Selenium repository; it resolves and downloads browsers and drivers on its own, so an adapter must name its driver path explicitly and a sealed run must not invoke it"}
      - {name: "selenium-manager Rust crates (312 listed in selenium-manager.cdx.json inside the wheel)", spdx: "MPL-2.0", note: "six crates are MPL-2.0 (apple-flat-package, apple-xar, cpio-archive, cryptographic-message-syntax, option-ext, x509-certificate); the others are permissive or dual-licensed, one lists 'MIT OR Apache-2.0 OR LGPL-2.1-or-later'; the full list of expressions is in the SBOM file"}
      - {name: "browser JavaScript atoms (findElements.js, getAttribute.js, isDisplayed.js and the mutation listeners)", spdx: Apache-2.0, note: "part of the Selenium sources; their individual headers were not read"}
    trademark: {status: unverified, note: "no trademark policy was read; repository rule: the name identifies the integration only, no logos, no use in a ReDevOps product name"}
    redistribution: {status: optional_extra, default_enabled: false, reason: "the wheel bundles a binary with MPL-2.0 crates, so it is not redistributed without review; the operator installs the pinned wheel"}
    verification: {status: verified, method: "LICENSE and NOTICE fetched at the pinned tag with the GitHub contents API; wheel downloaded from the package registry and its file list, notices and SBOM read", checked_on: "2026-10-31"}
  - id: selenium-python-direct-deps
