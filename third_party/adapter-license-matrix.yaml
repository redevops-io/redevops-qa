      - {name: PySocks, version_constraint: "via urllib3[socks]", spdx: unverified, note: "the registry says only 'BSD', which names no clause count"}
    notices: []
    trademark: {status: unverified, note: "not checked"}
    redistribution: {status: optional_extra, default_enabled: false, reason: "installed by the operator with the pinned Selenium wheel; certifi is MPL-2.0 and needs review before it is ever redistributed"}
    verification: {status: registry-metadata, method: "licence field of each package's registry entry for its latest version on the check date, not the version a resolver would pick; transitive dependencies of these packages were not scanned", checked_on: "2026-10-31"}
