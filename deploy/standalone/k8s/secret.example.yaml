# The token Secret the Deployment mounts. The value is yours: this file holds none, and applying it unchanged fails (the service refuses an empty token).
# Create it without a file instead:
#   kubectl -n redevops-qa create secret generic redevops-qa-token --from-literal=token="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: redevops-qa-token
  namespace: redevops-qa
type: Opaque
stringData:
  token: ""
