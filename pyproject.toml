# Workspace configuration for the repository: test settings only. Nothing here is published; each package under
# packages/ has its own pyproject.toml.
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
    "packages/qa-bridge/tests",
    "packages/qa-playwright/tests",
    "packages/qa-egress/tests",
    "packages/qa-adapter-kit/tests",
    "packages/qa-selenium/tests",
    "packages/qa-robot/tests",
    "packages/qa-appium/tests",
    "packages/qa-checks/tests",
    "packages/qa-evidence/tests",
    "packages/qa-runner/tests",
    "packages/qa-service/tests",
]
pythonpath = [
    "packages/qa-bridge/src",
    "packages/qa-playwright/src",
    "packages/qa-egress/src",
    "packages/qa-adapter-kit/src",
    "packages/qa-selenium/src",
    "packages/qa-robot/src",
    "packages/qa-appium/src",
    "packages/qa-checks/src",
    "packages/qa-evidence/src",
    "packages/qa-fixture-app/src",
    "packages/qa-runner/src",
    "packages/qa-service/src",
]
# The real-browser lane (tests/browser in the browser-backed packages) is never collected by the offline suite: it needs
# Playwright and Chromium and runs only in its own CI job, which names those directories explicitly.
norecursedirs = ["browser", "real", "e2e", "egress", "robot_egress", ".*", "build", "dist", "*.egg", "venv", "__pycache__"]
addopts = "-ra -p no:cacheprovider --strict-markers --strict-config"
markers = [
    "check(id): conformance check (CHK1..CHK7, ADR A.2.5 item 4) a test belongs to",
    "not_applicable: a conformance item declared not applicable at this pin set (a receipt category, never a skip)",
    "appium_server: needs the Appium server and client installed (no device); collected only by the appium server CI job, never by the offline suite",
    "appium_android: needs the Appium server, the client and an attached Android emulator or device; collected only by the manual Android workflow, never by the offline suite",
    "robot_real: needs Robot Framework installed; collected only by the robot lane CI job, never by the offline suite",
    "browser: needs a real Chromium and the Playwright package; collected only by the browser CI job, never by the offline suite",
    "e2e: needs the real Chromium, Playwright and Robot Framework together; collected only by the runner end-to-end CI job, never by the offline suite",
    "robot_egress: needs the pinned Robot Framework on Linux with the kernel layers; the hostile-library egress experiments of the Robot lane; collected only by the runner Robot egress CI job, never by the offline suite",
    "egress: needs the real Chromium and Playwright; the hostile-page egress table and the gateway lost during a lane; collected only by the runner egress CI job, never by the offline suite",
]
filterwarnings = ["error"]
