# redevops-qa pins: what the bridge and the conformance suite are tied to. See packages/qa-bridge/README.md.
# Read by redevops_qa_bridge.pins; nothing about a dependency is hard-coded anywhere else.
#
# A pin set names an exact commit (and tag, once one exists) of each dependency. While a dependency has no release tag the
# pin is a TEMP-PIN (temp_pin = true, tag = ""): CI refuses a TEMP-PIN on main. default_set is used unless
# REDEVOPS_QA_PIN_SET (or --pin-set) selects another set.
#   c4 : runtime-contracts with the additive clarifications (addendum vectors, integrity refusal codes, reason_code)
#   c3 : runtime-contracts at the frozen interface commit (IF-1)
# Both sets pin the same harness QA module snapshot.
#
# source_path is relative to this file's directory; QA_PIN_CONTRACTS_PATH / QA_PIN_HARNESS_QA_PATH override it per machine
# for the selected set. distribution_sha256 is the digest of the tree(s) in distribution_paths (see
# redevops_qa_bridge.pins.tree_digest); vector_files lists the sha256 of every vector file, and a file that matches
# addendum_globs but is not listed is a failure (the pin is stale).
schema = "redevops-qa/pins"
version = 2
default_set = "c4"

# Settings shared by every pin set. The allow-lists are the *recorded, reviewed* differences the parity checks accept; any
# difference not listed here fails the check.
[conformance]
# schemas and enums that exist only in contracts, by design: the harness receives no plan record (ADR A.2.4 item 7)
contracts_only_schemas = ["runtime-contracts/qa/qa-plan"]
contracts_only_values = ["PlanGate", "PlanItem", "ResourceClaim"]
contracts_only_enums = ["CoverageContract", "EvidenceLevel"]
neutral_only_enums = []
# generic structural codes contracts raises that the neutral module folds into SPEC_INVALID
contracts_only_error_codes = ["INVALID_FIELD", "MISSING_FIELD", "DUPLICATE_ENTRY", "FLOAT_REFUSED", "SCHEMA_MISMATCH",
                              "PLAN_INVALID", "RECORD_INCONSISTENT", "ASSERTION_INTEGRITY"]
# codes only the neutral module raises (canonicalisation; BATCH_HALTED until the contracts side defines it)
neutral_only_error_codes = ["CANON_REFUSED", "BATCH_HALTED"]
# the real qa-playwright adapter, as "module:ClassName"; empty until that package exists. When non-empty it must resolve
# and satisfy both protocols; qa_playwright_required = true makes an empty value a failure.
qa_playwright_class = ""
qa_playwright_required = false

